apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-chatbot-frontend
  namespace: ai-chatbot
  labels:
    app: ai-chatbot
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-chatbot
      component: frontend
  template:
    metadata:
      labels:
        app: ai-chatbot
        component: frontend
    spec:
      containers:
        - name: frontend
          image: ai-chatbot/frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-chatbot-frontend
  namespace: ai-chatbot
spec:
  selector:
    app: ai-chatbot
    component: frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP

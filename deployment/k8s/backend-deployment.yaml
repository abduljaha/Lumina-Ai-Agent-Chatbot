apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-chatbot-backend
  namespace: ai-chatbot
  labels:
    app: ai-chatbot
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ai-chatbot
      component: backend
  template:
    metadata:
      labels:
        app: ai-chatbot
        component: backend
    spec:
      containers:
        - name: backend
          image: ai-chatbot/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ai-chatbot-config
            - secretRef:
                name: ai-chatbot-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-chatbot-backend
  namespace: ai-chatbot
spec:
  selector:
    app: ai-chatbot
    component: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
